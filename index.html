<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abd-Afx-chart | شارت الذهب</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>window.LightweightCharts||document.write('<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"><\/script>')</script>
<script>window.LightweightCharts||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"><\/script>')</script>
<style>
:root{--bg:#0d1117;--p:#161b22;--b:#30363d;--t:#e6edf3;--g:#d4af37}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font-family:system-ui,Tahoma,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--p);border-bottom:1px solid var(--b)}
.logo{font-weight:800;color:var(--g);font-size:18px;direction:ltr}
.price{font-weight:700;direction:ltr;margin-inline-start:auto}
button{background:#21262d;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
button.on{background:var(--g);color:#000;border-color:var(--g)}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px;background:var(--p);border-bottom:1px solid var(--b)}
#wrap{position:relative;flex:1;min-height:300px;direction:ltr}
#chart,#ov{position:absolute;inset:0}#ov{pointer-events:none}
#ov.act{pointer-events:auto;cursor:crosshair}
.lock{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:5;text-align:center;padding:20px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9}
.modal>div{background:var(--p);border:1px solid var(--b);padding:20px;border-radius:10px;width:min(360px,92vw)}
input{width:100%;padding:9px;margin:8px 0;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:6px}
small{color:#8b949e}
</style>
</head>
<body>
<header>
 <span class="logo">Abd-Afx-chart</span><span>XAU/USD</span>
 <span class="price" id="px">--</span>
 <button id="subBtn" class="on">اشتراك شهري</button>
</header>
<div class="bar" id="tf"></div>
<div class="bar" id="tools"></div>
<div id="wrap"><div id="chart"></div><canvas id="ov"></canvas>
 <div class="lock" id="lock"><div>🔒 هذا الإطار/الأداة للمشتركين فقط<br><br><button class="on" onclick="openSub()">اشترك الآن</button></div></div>
</div>

<div class="modal" id="m"><div>
 <h3 style="margin:0">الاشتراك الشهري</h3>
 <small>أدخل بريدك. بعد الدفع/التواصل يتم تفعيل اشتراكك يدوياً. إذا كنت مفعّل اكتب بريدك واضغط «دخول».</small>
 <input id="em" type="email" placeholder="you@email.com" dir="ltr">
 <button class="on" id="send">طلب اشتراك</button> <button id="login">دخول</button> <button onclick="m.style.display='none'">إغلاق</button>
 <p id="msg"></p>
</div></div>

<script>
/* ===== إعدادات صاحب الموقع ===== */
const SUB_ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID"; // ضع رابط Formspree هنا لتصلك الإيميلات
let SUBS={}; // يُحمَّل من subscribers.json (تديره من لوحة الأدمن)
fetch("subscribers.json?t="+Date.now()).then(r=>r.json()).then(j=>SUBS=j).catch(()=>{});
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,"0")).join("");
let PUB=[];
fetch("drawings.json?t="+Date.now()).then(r=>r.json()).then(j=>{PUB=j;if(localStorage.ab_tk&&!drawings.length)drawings=j;draw()}).catch(()=>{});
const SYMBOL="PAXGUSDT"; // PAXG مربوط بسعر الذهب (بديل مجاني للسعر الحي)
/* ================================= */
const $=id=>document.getElementById(id);
function openSub(){$("m").style.display="flex"}
$("subBtn").onclick=openSub;
window.onerror=(e)=>{$("px").textContent="خطأ: "+e};
const TFS={ "1m":["1m",60],"5m":["5m",300],"15m":["15m",900],"1h":["1h",3600]};
const FREE=["1h"]; let tf="1h", tool=null, drawings=[], cur=null, ws, data=[], loading=false;
const yearAgo=()=>Date.now()/1000-365*86400;
const isSub=()=>{if(localStorage.ab_tk)return true;const h=localStorage.ab_h,x=SUBS[h];return !!(h&&x&&new Date(x.exp)>new Date())};

const chart=LightweightCharts.createChart($("chart"),{layout:{background:{color:"#0d1117"},textColor:"#c9d1d9"},grid:{vertLines:{color:"#1c2128"},horzLines:{color:"#1c2128"}},timeScale:{timeVisible:true,rightOffset:5},crosshair:{mode:0}});
const series=chart.addCandlestickSeries({upColor:"#26a69a",downColor:"#ef5350",borderVisible:false,wickUpColor:"#26a69a",wickDownColor:"#ef5350"});
new ResizeObserver(()=>{chart.resize($("wrap").clientWidth,$("wrap").clientHeight);size();draw()}).observe($("wrap"));

/* ===== البيانات ===== */
async function kl(end){
 const u=`https://api.binance.com/api/v3/klines?symbol=${SYMBOL}&interval=${TFS[tf][0]}&limit=1000`+(end?`&endTime=${end}`:"");
 const r=await (await fetch(u)).json();
 return r.map(k=>({time:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));
}
async function load(){
 data=[];ws&&ws.close();const mine=tf;
 try{data=await kl();}catch(e){$("px").textContent="خطأ في جلب الأسعار";return}
 if(mine!==tf)return;
 series.setData(data);chart.timeScale().scrollToRealTime();live();
}
async function more(){
 if(loading||!data.length||data[0].time<yearAgo())return;loading=true;
 try{const old=await kl(data[0].time*1000-1);
  if(old.length){const r=chart.timeScale().getVisibleLogicalRange();data=old.concat(data);series.setData(data);
   if(r)chart.timeScale().setVisibleLogicalRange({from:r.from+old.length,to:r.to+old.length});}
 }catch(e){}loading=false;
}
chart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r&&r.from<40)more();draw()});
function live(){
 ws=new WebSocket(`wss://stream.binance.com:9443/ws/${SYMBOL.toLowerCase()}@kline_${TFS[tf][0]}`);
 ws.onmessage=e=>{const k=JSON.parse(e.data).k;const c={time:k.t/1000,open:+k.o,high:+k.h,low:+k.l,close:+k.c};
  series.update(c);$("px").textContent=c.close.toFixed(2);};
}

/* ===== واجهة ===== */
for(const k in TFS){const b=document.createElement("button");b.textContent=k;b.id="tf"+k;b.onclick=()=>setTf(k);$("tf").append(b)}
function setTf(k){
 if(!FREE.includes(k)&&!isSub()){$("lock").style.display="flex";return}
 $("lock").style.display="none";tf=k;
 document.querySelectorAll("#tf button").forEach(b=>b.classList.toggle("on",b.id==="tf"+k));load();
}
const TOOLS=[["hline","خط أفقي",1],["rect","مربع",2],["buy","زون شراء",2],["sell","زون بيع",2],["chan","قناة سعرية",3],["fib","فيبوناتشي",2]];
TOOLS.forEach(([id,n])=>{const b=document.createElement("button");b.textContent=n;b.id="t"+id;b.onclick=()=>pick(id);$("tools").append(b)});
const clr=document.createElement("button");clr.textContent="مسح الكل";clr.onclick=()=>{drawings=[];save();draw()};$("tools").append(clr);
const und=document.createElement("button");und.textContent="تراجع";und.onclick=()=>{drawings.pop();save();draw()};$("tools").append(und);
if(localStorage.ab_tk){const pb=document.createElement("button");pb.textContent="📢 نشر للجميع";pb.className="on";pb.onclick=publish;$("tools").append(pb)}
async function publish(){
 const api="https://api.github.com/repos/abd317136-svg/abd-afx-chart/contents/drawings.json";
 const H={Authorization:"Bearer "+localStorage.ab_tk,Accept:"application/vnd.github+json"};
 try{let sh;const g=await fetch(api+"?t="+Date.now(),{headers:H});if(g.ok)sh=(await g.json()).sha;
 const body={message:"drawings",content:btoa(unescape(encodeURIComponent(JSON.stringify(drawings.map(d=>({type:d.type,pts:d.pts}))))))};if(sh)body.sha=sh;
 const r=await fetch(api,{method:"PUT",headers:H,body:JSON.stringify(body)});
 alert(r.ok?"✅ تم النشر، بيظهر للجميع خلال دقيقة":"فشل النشر ("+r.status+")")}catch(e){alert("فشل النشر")}
}
function pick(id){
 if(!isSub()){$("lock").style.display="flex";return}
 tool=tool===id?null:id;cur=null;
 document.querySelectorAll("#tools button").forEach(b=>b.classList.toggle("on",b.id==="t"+tool));
 $("ov").classList.toggle("act",!!tool);
}

$("send").onclick=async()=>{
 const e=$("em").value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){$("msg").textContent="بريد غير صحيح";return}
 try{await fetch(SUB_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({email:e,plan:"monthly"})});
 $("msg").textContent="✅ تم إرسال طلبك، سيتم تفعيل اشتراكك قريباً"}catch(x){$("msg").textContent="تعذر الإرسال"}
};
$("login").onclick=async()=>{const h=await sha($("em").value.trim().toLowerCase());
 try{SUBS=await (await fetch("subscribers.json?t="+Date.now())).json()}catch(e){}
 if(SUBS[h]&&new Date(SUBS[h].exp)>new Date()){localStorage.ab_h=h;$("m").style.display="none";$("lock").style.display="none";alert("تم تفعيل اشتراكك ✅")}
 else $("msg").textContent="هذا البريد غير مفعّل أو منتهي"};

/* ===== الرسم ===== */
const cv=$("ov"),cx=cv.getContext("2d");
function size(){const w=$("wrap"),d=devicePixelRatio||1;cv.width=w.clientWidth*d;cv.height=w.clientHeight*d;cx.setTransform(d,0,0,d,0,0)}
const X=t=>chart.timeScale().timeToCoordinate(t), Y=p=>series.priceToCoordinate(p);
function save(){localStorage.ab_dr=JSON.stringify(drawings)}
try{drawings=JSON.parse(localStorage.ab_dr||"[]")}catch(e){}
const need=id=>TOOLS.find(t=>t[0]===id)[2];
cv.addEventListener("click",e=>{
 if(!tool)return;const r=cv.getBoundingClientRect();
 const t=chart.timeScale().coordinateToTime(e.clientX-r.left)??data[data.length-1].time;
 const p=series.coordinateToPrice(e.clientY-r.top);
 cur=cur||{type:tool,pts:[]};cur.pts.push({t,p});
 if(cur.pts.length>=need(tool)){drawings.push(cur);cur=null;save()}draw();
});
cv.addEventListener("mousemove",e=>{if(cur){const r=cv.getBoundingClientRect();cur.hover={t:chart.timeScale().coordinateToTime(e.clientX-r.left),p:series.coordinateToPrice(e.clientY-r.top)};draw()}});
const W=()=>cv.clientWidth;
function shape(d){
 const pts=d.hover&&d.pts.length<need(d.type)?d.pts.concat(d.hover):d.pts;
 const P=pts.filter(q=>q.t!=null).map(q=>({x:X(q.t),y:Y(q.p),p:q.p}));if(!P.length||P.some(q=>q.x==null||q.y==null))return;
 cx.lineWidth=1.5;
 if(d.type==="hline"){cx.strokeStyle="#d4af37";line(0,P[0].y,W(),P[0].y);cx.fillStyle="#d4af37";cx.fillText(P[0].p.toFixed(2),W()-60,P[0].y-4)}
 else if(["rect","buy","sell"].includes(d.type)&&P[1]){
  const c={rect:"41,121,255",buy:"38,166,154",sell:"239,83,80"}[d.type];
  cx.fillStyle=`rgba(${c},.25)`;cx.strokeStyle=`rgb(${c})`;
  cx.fillRect(P[0].x,P[0].y,P[1].x-P[0].x,P[1].y-P[0].y);cx.strokeRect(P[0].x,P[0].y,P[1].x-P[0].x,P[1].y-P[0].y);
  if(d.type!=="rect"){cx.fillStyle=`rgb(${c})`;cx.fillText(d.type==="buy"?"BUY":"SELL",Math.min(P[0].x,P[1].x)+4,Math.min(P[0].y,P[1].y)+14)}}
 else if(d.type==="chan"&&P[1]){
  cx.strokeStyle="#ab47bc";line(P[0].x,P[0].y,P[1].x,P[1].y);
  if(P[2]){const off=P[2].y-(P[0].y+(P[1].y-P[0].y)*((P[2].x-P[0].x)/(P[1].x-P[0].x||1)));
   line(P[0].x,P[0].y+off,P[1].x,P[1].y+off);cx.globalAlpha=.1;cx.fillStyle="#ab47bc";cx.beginPath();
   cx.moveTo(P[0].x,P[0].y);cx.lineTo(P[1].x,P[1].y);cx.lineTo(P[1].x,P[1].y+off);cx.lineTo(P[0].x,P[0].y+off);cx.fill();cx.globalAlpha=1}}
 else if(d.type==="fib"&&P[1]){
  const a=pts[0].p,b=pts[1].p,x1=Math.min(P[0].x,P[1].x),x2=Math.max(P[0].x,P[1].x);
  [0,.236,.382,.5,.618,.786,1].forEach(l=>{const pr=b-(b-a)*l,y=Y(pr);if(y==null)return;
   cx.strokeStyle="#ffb300";cx.setLineDash(l?[4,4]:[]);line(x1,y,x2,y);cx.setLineDash([]);
   cx.fillStyle="#ffb300";cx.fillText(`${l} (${pr.toFixed(2)})`,x1+4,y-3)});}
}
function line(a,b,c,d){cx.beginPath();cx.moveTo(a,b);cx.lineTo(c,d);cx.stroke()}
function draw(){cx.clearRect(0,0,cv.width,cv.height);cx.font="11px sans-serif";if(localStorage.ab_tk)drawings.forEach(shape);else{PUB.forEach(shape);drawings.forEach(shape)}if(cur)shape(cur)}
chart.timeScale().subscribeVisibleTimeRangeChange(draw);
$("wrap").addEventListener("wheel",()=>requestAnimationFrame(draw));
setInterval(draw,500);
size();setTf("1h");
</script>
</body>
</html>
