<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afx-DrAlan-chart-created-by-Abd⚜️ | شارت الذهب</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>window.LightweightCharts||document.write('<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"><\/script>')</script>
<script>window.LightweightCharts||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"><\/script>')</script>
<style>
:root{--bg:#0d1117;--p:#161b22;--b:#30363d;--t:#e6edf3;--g:#d4af37}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font-family:system-ui,Tahoma,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--p);border-bottom:1px solid var(--b)}
.logo{font-weight:800;color:var(--g);font-size:18px;direction:ltr}
.price{font-weight:700;direction:ltr;margin-inline-start:auto}
button{background:#21262d;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
button.on{background:var(--g);color:#000;border-color:var(--g)}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px;background:var(--p);border-bottom:1px solid var(--b)}
#wrap{position:relative;flex:1;min-height:300px;direction:ltr}
#chart,#ov{position:absolute;left:0;top:0;width:100%;height:100%}#chart{z-index:0}#wrap{touch-action:none}#ov{z-index:10}#ov{pointer-events:none}
#ov.act{pointer-events:auto;cursor:crosshair;touch-action:none}
.lock{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30}
.modal.gate{background:#0d1117;z-index:60}.modal.gate .x{display:none}
.modal>div{background:var(--p);border:1px solid var(--b);padding:20px;border-radius:10px;width:min(360px,92vw)}
input{width:100%;padding:9px;margin:8px 0;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:6px}
small{color:#8b949e}
</style>
</head>
<body>
<header>
 <span class="logo">Afx-DrAlan-chart-created-by-Abd⚜️</span><small>v15</small><span>XAU/USD</span>
 <span class="price" id="px">--</span>
 <button id="subBtn" class="on">اشتراك شهري</button>
 <button id="admUsers" style="display:none">👥 المشتركين</button><button id="admOut" style="display:none">خروج الأدمن</button>
</header>
<div class="bar" id="tf"></div>
<div class="bar" id="tools"></div>
<div id="wrap"><div id="chart"></div><canvas id="ov"></canvas>
 <div class="lock" id="lock"><div>🔒 هذا الإطار/الأداة للمشتركين فقط<br><br><button class="on" onclick="openSub()">اشترك الآن</button></div></div>
</div>

<div class="modal" id="am"><div>
 <h3 style="margin:0">دخول الأدمن</h3><small>الصق الـ Token تبعك</small>
 <input id="amTk" type="password" dir="ltr" placeholder="github_pat_...">
 <button class="on" id="amGo">دخول</button> <button class="x" onclick="$('am').style.display='none'">إغلاق</button><p id="amMsg"></p>
</div></div>
<div id="sm" style="display:none;position:fixed;inset:0;background:#0d1117;z-index:40">
 <button onclick="$('sm').style.display='none'" style="position:absolute;top:8px;left:8px;z-index:2">✖ إغلاق</button>
 <iframe id="sf" style="position:absolute;top:44px;left:0;width:100%;height:calc(100% - 44px);border:0"></iframe>
</div>
<div class="modal" id="m"><div>
 <h3 style="margin:0">الاشتراك الشهري</h3>
 <small>أدخل بريدك. بعد الدفع/التواصل يتم تفعيل اشتراكك يدوياً. إذا كنت مفعّل اكتب بريدك واضغط «دخول».</small>
 <input id="em" type="email" placeholder="you@email.com" dir="ltr">
 <button class="on" id="send">طلب اشتراك</button> <button id="login">دخول</button> <button class="x" onclick="$('m').style.display='none'">إغلاق</button>
 <p id="msg"></p>
</div></div>

<script>
/* ===== إعدادات صاحب الموقع ===== */
const SUB_ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID"; // ضع رابط Formspree هنا لتصلك الإيميلات
let SUBS={}; // يُحمَّل من subscribers.json (تديره من لوحة الأدمن)
fetch("subscribers.json?t="+Date.now()).then(r=>r.json()).then(j=>{SUBS=j;gate()}).catch(()=>{});
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,"0")).join("");
let PUB=[];
fetch("drawings.json?t="+Date.now()).then(r=>r.json()).then(j=>{PUB=j;if(localStorage.ab_tk&&!drawings.length)drawings=j;draw()}).catch(()=>{});
const SYMBOL="PAXGUSDT"; // PAXG مربوط بسعر الذهب (بديل مجاني للسعر الحي)
/* ================================= */
const $=id=>document.getElementById(id);
function openSub(){$("m").style.display="flex"}
$("subBtn").onclick=openSub;
window.onerror=(e)=>{$("px").textContent="خطأ: "+e};
if(location.hash==="#login")openSub();
if(localStorage.ab_tk){$("admUsers").style.display=$("admOut").style.display=""}
$("admUsers").onclick=()=>{$("sf").src="admin.html";$("sm").style.display="block"};
$("admOut").onclick=()=>{localStorage.removeItem("ab_tk");location.hash="";location.reload()};
if(location.hash==="#admin"&&!localStorage.ab_tk){$("am").classList.add("gate");$("am").style.display="flex"}
$("amGo").onclick=async()=>{const t=$("amTk").value.trim();
 try{const r=await fetch("https://api.github.com/repos/abd317136-svg/abd-afx-chart/contents/subscribers.json",{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json"}});
  if(!r.ok)throw 0;localStorage.ab_tk=t;location.hash="";location.reload()}catch(e){$("amMsg").textContent="Token غير صحيح"}};
const TFS={ "1m":["1m",60],"5m":["5m",300],"15m":["15m",900],"1h":["1h",3600]};
const FREE=["1h"]; let tf="1h", tool=null, drawings=[], cur=null, ws, data=[], loading=false;
const yearAgo=()=>Date.now()/1000-365*86400;
const isSub=()=>{if(localStorage.ab_tk)return true;const h=localStorage.ab_h,x=SUBS[h];return !!(h&&x&&new Date(x.exp)>new Date())};

const chart=LightweightCharts.createChart($("chart"),{layout:{background:{color:"#0d1117"},textColor:"#c9d1d9"},grid:{vertLines:{color:"#1c2128"},horzLines:{color:"#1c2128"}},timeScale:{timeVisible:true,rightOffset:5},crosshair:{mode:0}});
const series=chart.addCandlestickSeries({upColor:"#26a69a",downColor:"#ef5350",borderVisible:false,wickUpColor:"#26a69a",wickDownColor:"#ef5350"});
new ResizeObserver(()=>{chart.resize($("wrap").clientWidth,$("wrap").clientHeight);size();draw()}).observe($("wrap"));

/* ===== البيانات ===== */
const IV={by:{"1m":"1","5m":"5","15m":"15","1h":"60"},kr:{"1m":1,"5m":5,"15m":15,"1h":60}};
const BN=["https://data-api.binance.vision","https://api.binance.com","https://api1.binance.com"];
const PROV=[
 {n:"Repo",f:async(tf,end,lim)=>{if(end)return [];
  const r=await fetch(`data/${tf}.json?t=`+Math.floor(Date.now()/60000));if(!r.ok)throw new Error("HTTP "+r.status);
  return (await r.json()).map(k=>({time:k[0],open:k[1],high:k[2],low:k[3],close:k[4]}))}},
 {n:"Bybit",f:async(tf,end,lim)=>{
  const j=await(await fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=XAUUSDT&interval=${IV.by[tf]}&limit=${lim}`+(end?`&end=${end}`:""))).json();
  if(j.retCode!==0)throw new Error(j.retMsg);
  return j.result.list.map(k=>({time:+k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4]})).reverse()}},
 {n:"Binance",f:async(tf,end,lim)=>{let err;
  for(const h of BN){try{const r=await fetch(`${h}/api/v3/klines?symbol=${SYMBOL}&interval=${TFS[tf][0]}&limit=${lim}`+(end?`&endTime=${end}`:""));
   const j=await r.json();if(!Array.isArray(j))throw new Error(j.msg||"bad");
   return j.map(k=>({time:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4]}))}catch(e){err=e}}throw err}},
 {n:"Kraken",f:async(tf,end,lim)=>{
  if(end)return [];
  const j=await(await fetch(`https://api.kraken.com/0/public/OHLC?pair=PAXGUSD&interval=${IV.kr[tf]}`)).json();
  if(j.error&&j.error.length)throw new Error(j.error[0]);
  const k=Object.values(j.result).find(Array.isArray);
  return k.map(x=>({time:+x[0],open:+x[1],high:+x[2],low:+x[3],close:+x[4]}))}}
];
let cur2=0;
async function kl(end,lim=1000){
 if(end)return PROV[cur2].f(tf,end,lim);
 let err;
 for(let i=0;i<PROV.length;i++){const p=(cur2+i)%PROV.length;
  try{const d=await PROV[p].f(tf,0,lim);if(d.length){cur2=p;return d}}catch(e){err=e}}
 throw err||new Error("no data");
}
async function load(){
 $("px").textContent="جاري التحميل...";data=[];clearInterval(timer);const mine=tf;
 try{data=await kl();}catch(e){$("px").textContent="تعذر جلب الأسعار: "+e.message;return}
 if(mine!==tf)return;
 series.setData(data);chart.timeScale().scrollToRealTime();
 $("px").textContent=data[data.length-1].close.toFixed(2);live();
}
async function more(){
 if(loading||!data.length||data[0].time<yearAgo())return;loading=true;
 try{const old=await kl(data[0].time*1000-1);
  if(old.length){const r=chart.timeScale().getVisibleLogicalRange();data=old.concat(data);series.setData(data);
   if(r)chart.timeScale().setVisibleLogicalRange({from:r.from+old.length,to:r.to+old.length});}
 }catch(e){}loading=false;
}
chart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r&&r.from<40)more();draw()});
let timer;
function live(){
 clearInterval(timer);const mine=tf;
 timer=setInterval(async()=>{try{
  const p=+(await(await fetch("https://api.gold-api.com/price/XAU")).json()).price;
  if(mine!==tf||!p||!data.length)return;
  const sec=TFS[tf][1],b=Math.floor(Date.now()/1000/sec)*sec,l=data[data.length-1];let c;
  if(b>l.time){c={time:b,open:p,high:p,low:p,close:p};data.push(c)}
  else{c={time:l.time,open:l.open,high:Math.max(l.high,p),low:Math.min(l.low,p),close:p};data[data.length-1]=c}
  series.update(c);$("px").textContent=p.toFixed(2);
 }catch(e){}},4000);
}

/* ===== واجهة ===== */
for(const k in TFS){const b=document.createElement("button");b.textContent=k;b.id="tf"+k;b.onclick=()=>setTf(k);$("tf").append(b)}
function setTf(k){
 if(!FREE.includes(k)&&!isSub()){$("lock").style.display="flex";return}
 $("lock").style.display="none";tf=k;
 document.querySelectorAll("#tf button").forEach(b=>b.classList.toggle("on",b.id==="tf"+k));load();
}
const TOOLS=[["hline","خط أفقي",1],["rect","مربع",2],["buy","زون شراء",2],["sell","زون بيع",2],["chan","قناة سعرية",3],["fib","فيبوناتشي",2]];
TOOLS.forEach(([id,n])=>{const b=document.createElement("button");b.textContent=n;b.id="t"+id;b.onclick=()=>pick(id);$("tools").append(b)});
const clr=document.createElement("button");clr.textContent="مسح الكل";clr.onclick=()=>{drawings=[];save();draw()};$("tools").append(clr);
let pan=false;
function mode(){$("ov").classList.toggle("act",!!tool&&!pan)}
function setPan(v){pan=v;$("tpan").classList.toggle("on",pan);mode()}
const pn=document.createElement("button");pn.textContent="✋ تحريك";pn.id="tpan";pn.onclick=()=>setPan(!pan);$("tools").prepend(pn);
const und=document.createElement("button");und.textContent="تراجع";und.onclick=()=>{drawings.pop();save();draw()};$("tools").append(und);
if(localStorage.ab_tk){const pb=document.createElement("button");pb.textContent="📢 نشر للجميع";pb.className="on";pb.onclick=publish;$("tools").append(pb)}
async function publish(){
 const api="https://api.github.com/repos/abd317136-svg/abd-afx-chart/contents/drawings.json";
 const H={Authorization:"Bearer "+localStorage.ab_tk,Accept:"application/vnd.github+json"};
 try{let sh;const g=await fetch(api+"?t="+Date.now(),{headers:H});if(g.ok)sh=(await g.json()).sha;
 const body={message:"drawings",content:btoa(unescape(encodeURIComponent(JSON.stringify(drawings.map(d=>({type:d.type,pts:d.pts}))))))};if(sh)body.sha=sh;
 const r=await fetch(api,{method:"PUT",headers:H,body:JSON.stringify(body)});
 alert(r.ok?"✅ تم النشر، بيظهر للجميع خلال دقيقة":"فشل النشر ("+r.status+")")}catch(e){alert("فشل النشر")}
}
function pick(id){
 if(!localStorage.ab_tk)return;
 tool=tool===id?null:id;cur=null;
 document.querySelectorAll("#tools button[id^=t]:not(#tpan)").forEach(b=>b.classList.toggle("on",b.id==="t"+tool));
 setPan(false);
}

$("send").onclick=async()=>{
 const e=$("em").value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){$("msg").textContent="بريد غير صحيح";return}
 try{await fetch(SUB_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({email:e,plan:"monthly"})});
 $("msg").textContent="✅ تم إرسال طلبك، سيتم تفعيل اشتراكك قريباً"}catch(x){$("msg").textContent="تعذر الإرسال"}
};
$("login").onclick=async()=>{const h=await sha($("em").value.trim().toLowerCase());
 try{SUBS=await (await fetch("subscribers.json?t="+Date.now())).json()}catch(e){}
 if(SUBS[h]&&new Date(SUBS[h].exp)>new Date()){localStorage.ab_h=h;gate();$("m").style.display="none";$("lock").style.display="none";alert("تم تفعيل اشتراكك ✅")}
 else $("msg").textContent="هذا البريد غير مفعّل أو منتهي"};

/* ===== الرسم ===== */
const cv=$("ov"),cx=cv.getContext("2d");
function size(){const w=$("wrap"),d=devicePixelRatio||1;cv.width=w.clientWidth*d;cv.height=w.clientHeight*d;cx.setTransform(d,0,0,d,0,0)}
function t2x(t){
 const n=data.length;if(!n)return null;const sec=TFS[tf][1];let idx;
 if(t>=data[n-1].time)idx=n-1+(t-data[n-1].time)/sec;
 else if(t<=data[0].time)idx=(t-data[0].time)/sec;
 else{let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(data[m].time<=t)lo=m;else hi=m}
  idx=lo+(t-data[lo].time)/((data[hi].time-data[lo].time)||1)}
 return chart.timeScale().logicalToCoordinate(idx);
}
function x2t(x){
 const L=chart.timeScale().coordinateToLogical(x),n=data.length;if(L==null||!n)return null;const sec=TFS[tf][1];
 if(L>=n-1)return data[n-1].time+(L-(n-1))*sec;
 if(L<=0)return data[0].time+L*sec;
 const i=Math.floor(L);return data[i].time+(data[i+1].time-data[i].time)*(L-i);
}
const X=t=>t2x(t), Y=p=>series.priceToCoordinate(p);
function save(){localStorage.ab_dr=JSON.stringify(drawings)}
try{drawings=JSON.parse(localStorage.ab_dr||"[]")}catch(e){}
const need=id=>TOOLS.find(t=>t[0]===id)[2];
cv.addEventListener("pointerup",e=>{try{
 if(!tool||pan)return;const r=cv.getBoundingClientRect();
 const t=x2t(e.clientX-r.left)??data[data.length-1].time;
 const p=series.coordinateToPrice(e.clientY-r.top);
 cur=cur||{type:tool,pts:[]};cur.pts.push({t,p});
 if(cur.pts.length>=need(tool)){drawings.push(cur);cur=null;save();setPan(true)}draw()}catch(x){alert("خطأ رسم: "+x.message)}
});
cv.addEventListener("pointermove",e=>{if(cur&&!pan){const r=cv.getBoundingClientRect();cur.hover={t:x2t(e.clientX-r.left),p:series.coordinateToPrice(e.clientY-r.top)};draw()}});
const W=()=>cv.clientWidth;
function shape0(d){
 const pts=d.hover&&d.pts.length<need(d.type)?d.pts.concat(d.hover):d.pts;
 const P=pts.filter(q=>q.t!=null).map(q=>({x:X(q.t),y:Y(q.p),p:q.p}));if(!P.length||P.some(q=>q.x==null||q.y==null))return;
 cx.lineWidth=1.5;
 if(d.type==="hline"){cx.strokeStyle="#d4af37";line(0,P[0].y,W(),P[0].y);cx.fillStyle="#d4af37";cx.fillText(P[0].p.toFixed(2),W()-60,P[0].y-4)}
 else if(["rect","buy","sell"].includes(d.type)&&P[1]){
  const c={rect:"41,121,255",buy:"38,166,154",sell:"239,83,80"}[d.type];
  cx.fillStyle=`rgba(${c},.25)`;cx.strokeStyle=`rgb(${c})`;
  const rx=Math.min(P[0].x,P[1].x),ry=Math.min(P[0].y,P[1].y),rw=Math.max(6,Math.abs(P[1].x-P[0].x)),rh=Math.max(4,Math.abs(P[1].y-P[0].y));
  cx.fillRect(rx,ry,rw,rh);cx.strokeRect(rx,ry,rw,rh);
  if(d.type!=="rect"){cx.fillStyle=`rgb(${c})`;cx.fillText(d.type==="buy"?"BUY":"SELL",rx+4,ry-4)}}
 else if(d.type==="chan"&&P[1]){
  cx.strokeStyle="#ab47bc";line(P[0].x,P[0].y,P[1].x,P[1].y);
  if(P[2]){const off=P[2].y-(P[0].y+(P[1].y-P[0].y)*((P[2].x-P[0].x)/(P[1].x-P[0].x||1)));
   line(P[0].x,P[0].y+off,P[1].x,P[1].y+off);cx.globalAlpha=.1;cx.fillStyle="#ab47bc";cx.beginPath();
   cx.moveTo(P[0].x,P[0].y);cx.lineTo(P[1].x,P[1].y);cx.lineTo(P[1].x,P[1].y+off);cx.lineTo(P[0].x,P[0].y+off);cx.fill();cx.globalAlpha=1}}
 else if(d.type==="fib"&&P[1]){
  const a=pts[0].p,b=pts[1].p,x1=Math.min(P[0].x,P[1].x),x2=Math.max(P[0].x,P[1].x);
  [0,.236,.382,.5,.618,.786,1].forEach(l=>{const pr=b-(b-a)*l,y=Y(pr);if(y==null)return;
   cx.strokeStyle="#ffb300";cx.setLineDash(l?[4,4]:[]);line(x1,y,x2,y);cx.setLineDash([]);
   cx.fillStyle="#ffb300";cx.fillText(`${l} (${pr.toFixed(2)})`,x1+4,y-3)});}
}
function line(a,b,c,d){cx.beginPath();cx.moveTo(a,b);cx.lineTo(c,d);cx.stroke()}
function draw(){cx.clearRect(0,0,cv.width,cv.height);cx.font="11px sans-serif";if(localStorage.ab_tk)drawings.forEach(shape);else PUB.forEach(shape);if(cur)shape(cur)}
chart.timeScale().subscribeVisibleTimeRangeChange(draw);
$("wrap").addEventListener("wheel",()=>requestAnimationFrame(draw));
let sel=null,drag=null;
function shape(d){shape0(d);if(d===sel){const P=pts2(d);if(P){cx.fillStyle="#fff";cx.strokeStyle="#000";cx.lineWidth=1.5;
 const Q=d.type==="hline"?[{x:W()-24,y:P[0].y}]:P;Q.forEach(q=>{cx.beginPath();cx.arc(q.x,q.y,7,0,6.3);cx.fill();cx.stroke()})}}}
function pts2(d){const r=d.pts.map(q=>({x:X(q.t),y:Y(q.p)}));return r.some(q=>q.x==null||q.y==null)?null:r}
function dseg(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((px-a.x)*dx+(py-a.y)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy))}
function hitTest(x,y){
 const T=18;
 for(let i=drawings.length-1;i>=0;i--){const d=drawings[i],P=pts2(d);if(!P)continue;
  if(d.type!=="hline")for(let k=0;k<P.length;k++)if(Math.hypot(x-P[k].x,y-P[k].y)<T)return{d,h:k};
  let body=false;
  if(d.type==="hline")body=Math.abs(y-P[0].y)<T;
  else if(P[1]&&["rect","buy","sell"].includes(d.type))body=x>=Math.min(P[0].x,P[1].x)-9&&x<=Math.max(P[0].x,P[1].x)+9&&y>=Math.min(P[0].y,P[1].y)-9&&y<=Math.max(P[0].y,P[1].y)+9;
  else if(P[1]&&d.type==="fib"){const a=d.pts[0].p,b=d.pts[1].p;
   body=x>=Math.min(P[0].x,P[1].x)-T&&x<=Math.max(P[0].x,P[1].x)+T&&[0,.236,.382,.5,.618,.786,1].some(l=>{const yy=Y(b-(b-a)*l);return yy!=null&&Math.abs(y-yy)<T})}
  else if(P[1]&&d.type==="chan"){body=dseg(x,y,P[0],P[1])<T;
   if(!body&&P[2]){const off=P[2].y-(P[0].y+(P[1].y-P[0].y)*((P[2].x-P[0].x)/(P[1].x-P[0].x||1)));
    body=dseg(x,y,{x:P[0].x,y:P[0].y+off},{x:P[1].x,y:P[1].y+off})<T}}
  if(body)return{d,h:-1};
 }
 return null;
}
const wrapEl=$("wrap");
function xy(e){const t=(e.touches&&e.touches[0])||e,r=wrapEl.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top}}
const idle=()=>!!localStorage.ab_tk&&!(tool&&!pan)&&!cur;
function setPt(q,x,y,onlyY){const p=series.coordinateToPrice(y);if(p!=null)q.p=p;if(!onlyY){const t=x2t(x);if(t!=null)q.t=t}}
wrapEl.addEventListener("pointerdown",e=>{
 if(!idle())return;const c=xy(e),h=hitTest(c.x,c.y);
 if(h){sel=h.d;drag={d:h.d,h:h.h,sx:c.x,sy:c.y,orig:h.d.pts.map(q=>({x:X(q.t),y:Y(q.p)}))};
  e.stopPropagation();e.preventDefault();try{wrapEl.setPointerCapture(e.pointerId)}catch(x){}}
 else sel=null;
},true);
["touchstart","mousedown"].forEach(n=>wrapEl.addEventListener(n,e=>{
 if(!idle())return;const c=xy(e);if(drag||hitTest(c.x,c.y)){e.stopPropagation();e.preventDefault()}},{capture:true,passive:false}));
["touchmove","mousemove","touchend","mouseup"].forEach(n=>wrapEl.addEventListener(n,e=>{
 if(drag){e.stopPropagation();if(e.cancelable)e.preventDefault()}},{capture:true,passive:false}));
window.addEventListener("pointermove",e=>{
 if(!drag)return;const c=xy(e),dx=c.x-drag.sx,dy=c.y-drag.sy,d=drag.d;
 if(drag.h>=0){const o=drag.orig[drag.h];setPt(d.pts[drag.h],o.x+dx,o.y+dy)}
 else d.pts.forEach((q,i)=>{const o=drag.orig[i];setPt(q,o.x+dx,o.y+dy,d.type==="hline")});
});
const endDrag=()=>{if(drag){drag=null;save()}};
window.addEventListener("pointerup",endDrag);window.addEventListener("pointercancel",endDrag);
const dl=document.createElement("button");dl.textContent="🗑 حذف المحدد";
dl.onclick=()=>{if(sel){drawings=drawings.filter(d=>d!==sel);sel=null;save()}};$("tools").append(dl);
const gate=()=>{const m=$("m");
 if(isSub()){if(m.classList.contains("gate")){m.classList.remove("gate");m.style.display="none"}}
 else if(location.hash!=="#admin"){m.classList.add("gate");m.style.display="flex"}};
gate();
if(!localStorage.ab_tk){$("tools").style.display="none";
 setInterval(()=>fetch("drawings.json?t="+Date.now()).then(r=>r.json()).then(j=>{PUB=j}).catch(()=>{}),30000)}
(function loop(){if(drawings.length||cur||PUB.length)draw();requestAnimationFrame(loop)})();
size();setTf("1h");
