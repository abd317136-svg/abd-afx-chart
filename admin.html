<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afx-DrAlan-chart-created-by-Abd⚜️ | Admin</title>
<style>body{background:#0d1117;color:#e6edf3;font-family:system-ui,Tahoma;margin:0;padding:16px;max-width:560px;margin:auto}
textarea{width:100%;padding:10px;margin:4px 0;border-radius:6px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:15px;box-sizing:border-box}
input,button{padding:10px;margin:4px 0;border-radius:6px;border:1px solid #30363d;background:#161b22;color:#e6edf3;width:100%;font-size:15px}
button{background:#d4af37;color:#000;font-weight:700;cursor:pointer}button.d{background:#da3633;color:#fff;width:auto;padding:5px 10px}
.r{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;padding:8px 0}small{color:#8b949e}h2{color:#d4af37}</style></head>
<body>
<h2>لوحة الأدمن · Afx-DrAlan-chart-created-by-Abd⚜️</h2>
<div id="a1">
 <small>أدخل GitHub Token (يُحفظ على جهازك فقط)</small>
 <input id="tk" type="password" dir="ltr" placeholder="github_pat_...">
 <button onclick="login()">دخول</button>
</div>
<div id="a2" style="display:none">
 <h3>رابط المشتركين</h3>
 <input id="lk" readonly dir="ltr" value="https://abd317136-svg.github.io/abd-afx-chart/#login">
 <button onclick="navigator.clipboard.writeText($('lk').value);this.textContent='✅ تم النسخ'">نسخ الرابط</button>
 <h3>تفعيل مشتركين</h3>
 <textarea id="em" rows="5" dir="ltr" placeholder="ضع الإيميلات هنا، كل إيميل بسطر&#10;ahmed@mail.com&#10;sara@mail.com  ملاحظة اختيارية (اسمه)"></textarea>
 <input id="dy" type="number" value="30" placeholder="عدد الأيام">
 <button onclick="add()">تفعيل / تمديد</button>
 <p id="msg"></p>
 <h3>المشتركين</h3><div id="ls"></div>
 <button onclick="logout()" style="background:#30363d;color:#fff;margin-top:20px">تسجيل خروج</button>
</div>
<script>
const OWNER="abd317136-svg",REPO="abd-afx-chart",F="subscribers.json";
const $=i=>document.getElementById(i),api=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${F}`;
let data={},sha=null;
const H=()=>({Authorization:"Bearer "+localStorage.ab_tk,Accept:"application/vnd.github+json"});
const hash=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,"0")).join("");
async function load(){
 const r=await fetch(api+"?t="+Date.now(),{headers:H()});
 if(r.status===404){data={};sha=null}
 else if(!r.ok){throw new Error("Token غير صحيح أو بدون صلاحية")}
 else{const j=await r.json();sha=j.sha;data=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))))}
 show();
}
async function save(msg){
 const body={message:msg,content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,1))))};if(sha)body.sha=sha;
 const r=await fetch(api,{method:"PUT",headers:H(),body:JSON.stringify(body)});
 if(!r.ok)throw new Error("فشل الحفظ ("+r.status+")");sha=(await r.json()).content.sha;show();
}
function show(){
 $("a1").style.display="none";$("a2").style.display="block";
 const k=Object.keys(data);$("ls").innerHTML=k.length?"":"<small>ما في مشتركين بعد</small>";
 k.forEach(h=>{const d=document.createElement("div");d.className="r";
  const ok=new Date(data[h].exp)>new Date();
  d.innerHTML=`<div>${data[h].note||h.slice(0,8)}<br><small>${ok?"🟢 حتى":"🔴 انتهى"} ${data[h].exp}</small></div>`;
  const b=document.createElement("button");b.className="d";b.textContent="حذف";
  b.onclick=async()=>{delete data[h];try{await save("remove")}catch(e){$("msg").textContent=e.message}};
  d.append(b);$("ls").append(d)});
}
async function login(){localStorage.ab_tk=$("tk").value.trim();try{await load()}catch(e){alert(e.message);localStorage.removeItem("ab_tk")}}
async function add(){
 const days=+$("dy").value||30;let n=0,bad=0;
 for(const ln of $("em").value.split(/\n/).map(x=>x.trim()).filter(Boolean)){
  const ems=ln.match(/[^\s,;]+@[^\s,;]+\.[^\s,;]+/g);if(!ems){bad++;continue}
  const note=ems.length===1?ln.replace(ems[0],"").replace(/^[\s,;\-]+/,"").trim():"";
  for(const e0 of ems){const h=await hash(e0.toLowerCase());
   let base=new Date();if(data[h]&&new Date(data[h].exp)>base)base=new Date(data[h].exp);
   base.setDate(base.getDate()+days);
   data[h]={exp:base.toISOString().slice(0,10),note:note||(data[h]&&data[h].note)||""};n++}
 }
 if(!n){$("msg").textContent="ما لقيت إيميل صحيح";return}
 try{await save("activate");$("msg").textContent="✅ تم تفعيل "+n+" مشترك"+(bad?" (تجاهلت "+bad+" سطر غير صحيح)":"");$("em").value=""}catch(x){$("msg").textContent=x.message}
}
function logout(){localStorage.removeItem("ab_tk");location.reload()}
if(localStorage.ab_tk)load().catch(()=>localStorage.removeItem("ab_tk"));
</script></body></html>
