<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>فحص المصادر</title>
<style>body{background:#0d1117;color:#e6edf3;font-family:system-ui;padding:16px}div{padding:10px;border-bottom:1px solid #30363d;direction:ltr;text-align:left;font-size:15px}</style></head>
<body><h3>فحص مصادر الأسعار</h3><div id="o"></div>
<script>
const T=[
["Bybit XAUUSDT","https://api.bybit.com/v5/market/kline?category=linear&symbol=XAUUSDT&interval=60&limit=2"],
["Binance Vision","https://data-api.binance.vision/api/v3/klines?symbol=PAXGUSDT&interval=1h&limit=2"],
["Binance","https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=1h&limit=2"],
["Kraken PAXG","https://api.kraken.com/0/public/OHLC?pair=PAXGUSD&interval=60"],
["Gold-API","https://api.gold-api.com/price/XAU"],
["jsDelivr (library)","https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"]
];
(async()=>{for(const [n,u] of T){const d=document.createElement("div");d.textContent="⏳ "+n;o.append(d);
 try{const r=await fetch(u);const t=await r.text();d.textContent=(r.ok?"✅ ":"❌ HTTP "+r.status+" ")+n+" — "+t.slice(0,70).replace(/\s+/g," ")}
 catch(e){d.textContent="❌ "+n+" — "+e.message}}})();
</script></body></html>
